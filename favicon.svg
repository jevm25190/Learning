:root{--bg:#fff;--surface:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--shadow:#0000000f 0 8px 18px;--accent:#2563eb;--k-red:#dc2626;--k-orange:#f97316;--k-yellow:#eab308;--k-green:#16a34a;--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light dark;font-synthesis:none;text-rendering:optimizelegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45}@media (prefers-color-scheme:dark){:root{--lightningcss-light: ;--lightningcss-dark:initial;--bg:#0b1220;--surface:#0f172a;--text:#f3f4f6;--muted:#9ca3af;--border:#1f2937;--shadow:#0006 0 10px 20px;--accent:#60a5fa}}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0}#root{min-height:100svh}h2,h3{margin:0;font-weight:650}h2{font-size:18px}h3{font-size:16px}.muted{color:var(--muted)}.app{flex-direction:column;min-height:100svh;display:flex}.topbar{z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;position:sticky;top:0}.topbar__title{margin-bottom:8px;font-weight:750}.topbar__nav{flex-wrap:wrap;gap:8px;display:flex}.navlink{color:var(--text);border:1px solid var(--border);background:0 0;border-radius:10px;padding:8px 10px;text-decoration:none}.navlink--active{border-color:var(--accent)}.content{width:100%;max-width:1100px;margin:0 auto;padding:14px}.stack{flex-direction:column;gap:12px;display:flex}.card{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:14px}.card--sub{box-shadow:none;padding:12px}.grid2{grid-template-columns:1fr 1fr;gap:12px;display:grid}@media (width<=900px){.grid2{grid-template-columns:1fr}}.rowline{justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;display:flex}.rowline__actions{flex-wrap:wrap;gap:8px;display:flex}.btn{border:1px solid var(--border);color:var(--text);cursor:pointer;background:0 0;border-radius:12px;padding:10px 12px}.btn--sm{border-radius:10px;padding:8px 10px}.btn--danger{border-color:var(--k-red)}.link{color:var(--text);cursor:pointer;font:inherit;text-align:left;background:0 0;border:none;padding:0}.field{flex-direction:column;gap:6px;display:flex}input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--border);background:0 0;border-radius:12px;padding:10px 12px}textarea{resize:vertical}.list{flex-direction:column;gap:8px;display:flex}.listitem{border:1px solid var(--border);border-radius:12px;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;display:flex}.listitem--selected{border-color:var(--accent)}.listitem__actions{flex-wrap:wrap;gap:8px;display:flex}.listitem--session{align-items:flex-start}.session__title{font-weight:650}.session__meta{color:var(--muted);flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;display:flex}.session__actions{flex-direction:column;align-items:flex-end;gap:8px;display:flex}.checkline{align-items:center;gap:10px;display:flex}.segmented{border:1px solid var(--border);border-radius:12px;display:inline-flex;overflow:hidden}.segmented__btn{cursor:pointer;color:var(--text);background:0 0;border:none;padding:10px 12px}.segmented__btn--active{background:#2563eb1f}.knowledge{grid-template-columns:1fr 1fr;gap:6px;display:grid}.kbtn{border:1px solid var(--border);cursor:pointer;background:0 0;border-radius:12px;min-width:110px;padding:8px 10px}.kbtn--active{outline:2px solid var(--border)}.kbtn--red{border-color:var(--k-red)}.kbtn--orange{border-color:var(--k-orange)}.kbtn--yellow{border-color:var(--k-yellow)}.kbtn--green{border-color:var(--k-green)}.badge{border:1px solid var(--border);border-radius:999px;align-items:center;padding:4px 10px;font-size:13px;display:inline-flex}.badge--muted{color:var(--muted)}.badge--red{border-color:var(--k-red)}.badge--orange{border-color:var(--k-orange)}.badge--yellow{border-color:var(--k-yellow)}.badge--green{border-color:var(--k-green)}.hintline{flex-wrap:wrap;gap:8px;display:flex}.table{flex-direction:column;gap:8px;display:flex}.row{border:1px solid var(--border);border-radius:12px;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:10px 12px;display:grid}.row--head{color:var(--muted);font-weight:650}@media (width<=700px){.row{grid-template-columns:2fr 1fr}.row>:nth-child(n+3){display:none}}.calendar__header{justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;display:flex}.calendar__title{text-transform:capitalize;font-weight:700}.calendar__grid{grid-template-columns:repeat(7,1fr);gap:6px;display:grid}.calendar__dow{text-align:center;color:var(--muted);font-weight:650}.calendar__day{border:1px solid var(--border);text-align:left;cursor:pointer;background:0 0;border-radius:12px;min-height:62px;padding:8px}.calendar__day--out{opacity:.45}.calendar__day--selected{border-color:var(--accent)}.calendar__daynum{font-weight:700}.calendar__dots{align-items:center;gap:6px;margin-top:6px;display:flex}.dot{background:var(--k-orange);border-radius:999px;width:10px;height:10px}.dot--done{background:var(--k-green)}.calendar__count{color:var(--muted);font-size:12px}.calendar__hint{color:var(--muted);margin-top:10px}
